<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>خلاصه‌کننده متن فارسی</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 50px auto;
            direction: rtl;
            background: #f5f7fa;
            color: #333;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 1.5px;
        }

        form {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.07);
            transition: box-shadow 0.3s ease;
        }
        form:hover {
            box-shadow: 0 12px 28px rgba(0,0,0,0.12);
        }

        label {
            font-weight: 600;
            font-size: 18px;
            display: block;
            margin-bottom: 12px;
            color: #34495e;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 15px 18px;
            font-size: 16px;
            border: 2px solid #d1d8e0;
            border-radius: 10px;
            resize: vertical;
            font-family: 'Tahoma', sans-serif;
            transition: border-color 0.3s ease;
            background-color: #fafafa;
            color: #2c3e50;
        }
        textarea:focus {
            border-color: #3498db;
            outline: none;
            background-color: #fff;
            box-shadow: 0 0 8px rgba(52,152,219,0.3);
        }

        input[type=submit] {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 17px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
            display: block;
            margin: 0 auto;
            user-select: none;
        }
        input[type=submit]:hover {
            background-color: #2980b9;
            box-shadow: 0 8px 22px rgba(41, 128, 185, 0.6);
        }
        input[type=submit]:active {
            background-color: #2471a3;
            box-shadow: 0 4px 12px rgba(36, 113, 163, 0.7);
        }

        .box {
            background: white;
            border-radius: 14px;
            margin-top: 30px;
            padding: 25px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            color: #2c3e50;
            line-height: 1.7;
            font-size: 18px;
            font-weight: 500;
        }

        .box label {
            font-size: 20px;
            color: #34495e;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>
    <h1>خلاصه‌کننده متن فارسی</h1>
    <form method="post">
        <label for="text">متن ورودی:</label><br>
        <textarea id="text" name="text" required>{{ input_text }}</textarea><br>
        <input type="submit" value="خلاصه کن">
    </form>

    {% if summary %}
    <div class="box">
        <label>خلاصه:</label>
        <p>{{ summary }}</p>
    </div>
    {% endif %}
</body>
</html>
